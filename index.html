<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Journal</title>
  <meta name="description" content="Stories and pictures from the field">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="#">Photo Journal</a>
    <nav class="site-header__nav">
      <a href="#gallery">Gallery</a>
    </nav>
  </header>
  
  
  <section class="intro" aria-label="Introduction">
    <p>Thick strokes of cadmium and violet catching the last light on the canyon rim.</p>
  </section>
  <main id="gallery" class="portfolio">
    <div class="portfolio__grid">
      <p class="portfolio__empty">No gallery items yet.</p>
    </div>
  </main>
  <footer class="site-footer">
    <p>Photo Journal</p>
  </footer>
  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <button type="button" class="lightbox__close" aria-label="Close">&times;</button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" src="" alt="">
      <figcaption class="lightbox__caption"></figcaption>
    </figure>
  </div>
  <script src="assets/site.js"></script>
</body>
</html>
